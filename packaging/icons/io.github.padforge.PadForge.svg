<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="0.7" cy="0.2" r="1.0">
      <stop offset="0" stop-color="#2a0f52"/>
      <stop offset="0.55" stop-color="#12072a"/>
      <stop offset="1" stop-color="#06030d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d0f38" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0b0618" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22e4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#22e4ff"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile"><rect x="6" y="6" width="116" height="116" rx="26"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- synthwave floor grid -->
  <g clip-path="url(#tile)" stroke="url(#gridfade)" stroke-width="1" fill="none">
    <path d="M6 96H122M6 104H122M6 113H122M6 122H122"/>
    <path d="M64 88L64 122M64 88L40 122M64 88L16 122M64 88L-8 122M64 88L88 122M64 88L112 122M64 88L136 122"/>
  </g>

  <!-- touchpad -->
  <rect x="24" y="28" width="80" height="56" rx="11" fill="url(#pad)"/>
  <rect x="24" y="28" width="80" height="56" rx="11" fill="none" stroke="url(#rim)" stroke-width="3" filter="url(#glow)"/>
  <path d="M30 72H98" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M64 72V82" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1"/>

  <!-- finger trail -->
  <path d="M36 66 C 46 52, 58 46, 80 42" fill="none" stroke="url(#trail)" stroke-width="3.2"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- touch point -->
  <circle cx="81" cy="42" r="11" fill="#ff2bd6" opacity="0.45" filter="url(#soft)"/>
  <circle cx="81" cy="42" r="10.5" fill="none" stroke="#ff2bd6" stroke-width="1.5" opacity="0.55"/>
  <circle cx="81" cy="42" r="6" fill="#ff2bd6" filter="url(#glow)"/>
  <circle cx="81" cy="42" r="2.6" fill="#ffffff"/>

  <!-- tile edge -->
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="#a855f7" stroke-opacity="0.45"/>
</svg>
